name: CI

on:
  push:
    branches-ignore:
      - 'audit/pre-release-hardening'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/wgcert
